services:
  - type: web
    name: iris-verification-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.9.18"
      - key: DATA_DIR
        value: "/app/data"
    disk:
      name: iris-data
      mountPath: /app/data
      sizeGB: 1
